name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libjsoncpp-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWHITEDNS_RELEASE=ON
      - run: cmake --build build -j$(nproc)
      - run: ./build/whitedns doctor
      - run: chmod +x ci/scan.sh && WHITEDNS_FAIL_ON=never ci/scan.sh google.com

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install cmake openssl jsoncpp pkg-config
      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix openssl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWHITEDNS_RELEASE=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix openssl)"
      - run: cmake --build build -j$(sysctl -n hw.ncpu)
      - run: ./build/whitedns doctor

  windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
    steps:
      - uses: actions/checkout@v7

      - name: Resolve vcpkg root
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          if (-not $root -or -not (Test-Path "$root/vcpkg.exe")) { $root = "C:/vcpkg" }
          if (-not (Test-Path "$root/vcpkg.exe")) { throw "vcpkg.exe not found" }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          Write-Host "Using VCPKG_ROOT=$root"

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-bincache-win-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-bincache-win-${{ runner.os }}-

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install openssl:x64-windows jsoncpp:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path $toolchain)) { throw "Toolchain missing: $toolchain" }
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWHITEDNS_RELEASE=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release -- /m

      - name: Doctor
        run: .\build\Release\whitedns.exe doctor
