name: domain-scan
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Name you are allowed to assess
        required: true
        default: google.com
      fail_on:
        description: warning, degraded, exposed, or never
        required: true
        default: degraded
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libjsoncpp-dev
      - run: chmod +x ci/scan.sh
      - name: audit
        run: |
          DOMAIN="${{ github.event.inputs.domain || 'google.com' }}"
          FAIL="${{ github.event.inputs.fail_on || 'never' }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then FAIL=never; fi
          WHITEDNS_DOMAIN="$DOMAIN" WHITEDNS_FAIL_ON="$FAIL" ci/scan.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: whitedns-audit
          path: |
            build/audit.json
            build/metrics.prom
      - name: email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: WhiteDNS scan failed for ${{ github.event.inputs.domain || 'google.com' }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Domain scan failed.
            Domain: ${{ github.event.inputs.domain || 'google.com' }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Artifacts: whitedns-audit (audit.json, metrics.prom)